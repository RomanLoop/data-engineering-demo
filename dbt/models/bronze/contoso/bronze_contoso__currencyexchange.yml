version: 2

models:
  - name: bronze_contoso__currencyexchange
    description: >
      Append-only bronze copy of the Contoso `currencyexchange` source
      (Stage-1: bootstrap_landing_table stands in for Meltano).
      Dedup-before-insert on business key + dedup columns:
      {{ doc("contoso_meta_convention") }}
      Static reference data — no SCD1/SCD2 in silver for this entity
      (AGENT.md §6/§12).
    config:
      contract:
        enforced: true
    meta:
      business_key: [Date, FromCurrency, ToCurrency]
      dedup_columns: [Exchange]
      pii_columns: []
    columns:
      - name: Date
        data_type: date
        description: Business key component.
        constraints:
          - type: not_null
      - name: FromCurrency
        data_type: string
        description: Business key component — ISO currency code.
        constraints:
          - type: not_null
      - name: ToCurrency
        data_type: string
        description: Business key component — ISO currency code.
        constraints:
          - type: not_null
      - name: Exchange
        data_type: double
        description: Exchange rate from FromCurrency to ToCurrency on Date.
      - name: _ingested_at
        data_type: timestamp
        description: Technical column — timestamp this row was appended to bronze.
        constraints:
          - type: not_null
      - name: _dedup_hash
        data_type: string
        description: Technical column — sha2(256) over business_key + dedup_columns.
        constraints:
          - type: not_null
