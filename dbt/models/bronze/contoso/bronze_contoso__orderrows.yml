version: 2

models:
  - name: bronze_contoso__orderrows
    description: >
      Append-only bronze copy of the Contoso `orderrows` source (Stage-1:
      bootstrap_landing_table stands in for Meltano). Dedup-before-insert
      on business key + dedup columns:
      {{ doc("contoso_meta_convention") }}
      Second fact entity — silver applies SCD1. Largest table in the
      project (2,349,091 rows) — first real check on the bronze
      dedup-hash approach past ~2.3M rows.
    config:
      contract:
        enforced: true
    meta:
      business_key: [OrderKey, LineNumber]
      dedup_columns: [ProductKey, Quantity, UnitPrice, NetPrice, UnitCost]
      pii_columns: []
    columns:
      - name: OrderKey
        description: Business key component. FK-shaped reference to orders.order_key — not enforced/joined in this change.
        data_type: int
        constraints:
          - type: not_null
      - name: LineNumber
        description: Business key component — order line sequence number.
        data_type: int
        constraints:
          - type: not_null
      - name: ProductKey
        data_type: int
        description: FK-shaped reference to product.product_key — not enforced/joined in this change.
      - name: Quantity
        data_type: int
      - name: UnitPrice
        data_type: double
      - name: NetPrice
        data_type: double
      - name: UnitCost
        data_type: double
      - name: _ingested_at
        data_type: timestamp
        description: Technical column — timestamp this row was appended to bronze.
        constraints:
          - type: not_null
      - name: _dedup_hash
        data_type: string
        description: Technical column — sha2(256) over business_key + dedup_columns.
        constraints:
          - type: not_null
