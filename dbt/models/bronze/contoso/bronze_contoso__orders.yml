version: 2

models:
  - name: bronze_contoso__orders
    description: >
      Append-only bronze copy of the Contoso `orders` source (Stage-1:
      bootstrap_landing_table stands in for Meltano). Dedup-before-insert
      on business key + dedup columns:
      {{ doc("contoso_meta_convention") }}
      First fact entity in the project — silver applies SCD1
      (overwrite-in-place), not SCD2 (AGENT.md §6/§12).
    config:
      contract:
        enforced: true
    meta:
      business_key: [OrderKey]
      dedup_columns: [CustomerKey, StoreKey, OrderDate, DeliveryDate, CurrencyCode]
      pii_columns: []
    columns:
      - name: OrderKey
        description: Business key — source order identifier. Not unique in bronze (append-only history); see silver for the current/overwritten view.
        data_type: int
        constraints:
          - type: not_null
      - name: CustomerKey
        data_type: int
        description: FK-shaped reference to customers.customer_key (001) — not enforced/joined in this change (spec.md Assumptions).
      - name: StoreKey
        data_type: int
        description: FK-shaped reference to store.store_key — not enforced/joined in this change.
      - name: OrderDate
        data_type: date
      - name: DeliveryDate
        data_type: date
        description: Nullable.
      - name: CurrencyCode
        data_type: string
      - name: _ingested_at
        data_type: timestamp
        description: Technical column — timestamp this row was appended to bronze.
        constraints:
          - type: not_null
      - name: _dedup_hash
        data_type: string
        description: Technical column — sha2(256) over business_key + dedup_columns.
        constraints:
          - type: not_null
      - name: order_year
        data_type: int
        description: >
          Derived partition key — year(OrderDate). Nullable to mirror
          OrderDate (no not_null constraint on it); a null order date would
          land in Delta's default partition. Listed last to match Delta's
          physical partition-column ordering.
