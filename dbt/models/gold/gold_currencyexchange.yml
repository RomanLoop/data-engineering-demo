version: 2

models:
  - name: gold_currencyexchange
    description: Currency exchange rate reference data, business logic layer. No surrogate key. No cross-entity joins yet.
    config:
      contract:
        enforced: true
    meta:
      business_key: [date, from_currency, to_currency]
    columns:
      - name: date
        data_type: date
        description: Business key component.
        constraints:
          - type: not_null
      - name: from_currency
        data_type: string
        description: Business key component.
        constraints:
          - type: not_null
      - name: to_currency
        data_type: string
        description: Business key component.
        constraints:
          - type: not_null
      - name: exchange
        data_type: double
