version: 2

models:
  - name: gold_orderrows
    description: >
      Current order lines, business logic layer. Relational, no surrogate
      key. No cross-entity joins yet — product_key is an unresolved
      FK-shaped column.
    config:
      contract:
        enforced: true
    meta:
      business_key: [order_key, line_number]
    columns:
      - name: order_key
        data_type: int
        description: Business key component.
        constraints:
          - type: not_null
      - name: line_number
        data_type: int
        description: Business key component.
        constraints:
          - type: not_null
      - name: product_key
        data_type: int
      - name: quantity
        data_type: int
      - name: unit_price
        data_type: double
      - name: net_price
        data_type: double
      - name: unit_cost
        data_type: double
