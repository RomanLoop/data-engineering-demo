version: 2

models:
  - name: gold_orders
    description: >
      Current orders, business logic layer. Relational, no surrogate key.
      No cross-entity joins yet — customer_key/store_key are unresolved
      FK-shaped columns.
    config:
      contract:
        enforced: true
    meta:
      business_key: [order_key]
    columns:
      - name: order_key
        data_type: int
        description: Business key.
        constraints:
          - type: not_null
        tests:
          - unique
      - name: customer_key
        data_type: int
      - name: store_key
        data_type: int
      - name: order_date
        data_type: date
      - name: delivery_date
        data_type: date
      - name: currency_code
        data_type: string
