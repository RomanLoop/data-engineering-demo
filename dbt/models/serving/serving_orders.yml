version: 2

models:
  - name: serving_orders
    description: Consumable view over gold_orders. No row-level security for this change.
    config:
      contract:
        enforced: true
    meta:
      business_key: [order_key]
    columns:
      - name: order_key
        data_type: int
        description: Business key.
        tests:
          - not_null
          - unique
      - name: customer_key
        data_type: int
      - name: store_key
        data_type: int
      - name: order_date
        data_type: date
      - name: delivery_date
        data_type: date
      - name: currency_code
        data_type: string
