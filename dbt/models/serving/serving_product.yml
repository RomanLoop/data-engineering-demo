version: 2

models:
  - name: serving_product
    description: >
      Consumable view over gold_product for BI/semantic-layer consumption.
      No row-level security for this change.
    config:
      contract:
        enforced: true
    meta:
      business_key: [product_key]
    columns:
      - name: product_key
        data_type: int
        description: Business key.
        tests:
          - not_null
          - unique
      - name: product_code
        data_type: string
      - name: product_name
        data_type: string
      - name: manufacturer
        data_type: string
      - name: brand
        data_type: string
      - name: color
        data_type: string
      - name: weight_unit
        data_type: string
      - name: weight
        data_type: double
      - name: cost
        data_type: double
      - name: price
        data_type: double
      - name: category_key
        data_type: int
      - name: category_name
        data_type: string
      - name: sub_category_key
        data_type: int
      - name: sub_category_name
        data_type: string
