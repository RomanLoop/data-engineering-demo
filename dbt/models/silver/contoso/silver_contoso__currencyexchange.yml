version: 2

models:
  - name: silver_contoso__currencyexchange
    description: >
      Cleansed currency exchange rate reference data, latest row per
      (date, from_currency, to_currency). No `meta.scd1_columns`/
      `scd2_columns` — omitted entirely, not SCD-managed (AGENT.md §6/§12).
      Composite business key — uniqueness covered by
      dbt/tests/assert_silver_contoso_composite_key_unique.sql (T006).
    config:
      contract:
        enforced: true
    meta:
      business_key: [date, from_currency, to_currency]
    columns:
      - name: date
        data_type: date
        description: Business key component.
        tests:
          - not_null
      - name: from_currency
        data_type: string
        description: Business key component.
        tests:
          - not_null
      - name: to_currency
        data_type: string
        description: Business key component.
        tests:
          - not_null
      - name: exchange
        data_type: double
      - name: _ingested_at
        data_type: timestamp
        description: Technical column, carried through from bronze.
        tests:
          - not_null
