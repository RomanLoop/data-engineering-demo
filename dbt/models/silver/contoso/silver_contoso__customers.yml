version: 2

models:
  - name: silver_contoso__customers
    description: >
      SCD2-historized customers. Customers is classic master data (spec.md),
      so every non-key attribute is tracked with full version history — no
      SCD1 (overwrite-in-place) columns for this entity. Exactly one row per
      customer_key has `_is_current = true` at any time; prior versions are
      retained with `_valid_from`/`_valid_to` closed out. See
      dbt/macros/apply_scd2.sql for the historization design.
    config:
      contract:
        enforced: true
    meta:
      business_key: [customer_key]
      scd1_columns: []
      scd2_columns:
        [
          geo_area_key, start_dt, end_dt, continent, gender, title,
          given_name, middle_initial, surname, street_address, city, state,
          state_full, zip_code, country, country_full, birthday, age,
          occupation, company, vehicle, latitude, longitude,
        ]
    columns:
      - name: customer_key
        data_type: int
        description: Business key.
        constraints:
          - type: not_null
        tests:
          - unique:
              config:
                where: "_is_current = true"
      - name: geo_area_key
        data_type: int
      - name: start_dt
        data_type: date
      - name: end_dt
        data_type: date
      - name: continent
        data_type: string
      - name: gender
        data_type: string
      - name: title
        data_type: string
      - name: given_name
        data_type: string
        description: PII.
      - name: middle_initial
        data_type: string
        description: PII.
      - name: surname
        data_type: string
        description: PII.
      - name: street_address
        data_type: string
        description: PII.
      - name: city
        data_type: string
        description: PII.
      - name: state
        data_type: string
      - name: state_full
        data_type: string
      - name: zip_code
        data_type: string
        description: PII.
      - name: country
        data_type: string
      - name: country_full
        data_type: string
      - name: birthday
        data_type: date
        description: PII.
      - name: age
        data_type: int
      - name: occupation
        data_type: string
      - name: company
        data_type: string
        description: PII.
      - name: vehicle
        data_type: string
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: _ingested_at
        data_type: timestamp
        description: Technical column — when the underlying bronze snapshot was ingested.
        constraints:
          - type: not_null
      - name: _scd_hash
        data_type: string
        description: Technical column — sha2(256) over business_key + scd2_columns (see generate_hash macro). Compared instead of the raw columns for change detection.
        constraints:
          - type: not_null
      - name: _valid_from
        data_type: timestamp
        description: Technical column — when this version became current.
        constraints:
          - type: not_null
      - name: _valid_to
        data_type: timestamp
        description: >
          Technical column — when this version was superseded. Never null:
          a sentinel high timestamp (9999-12-31 23:59:59) while the version
          is current, so range queries never need NULL-handling.
        constraints:
          - type: not_null
      - name: _is_current
        data_type: boolean
        description: Technical column — true for exactly one row per customer_key at any time.
        constraints:
          - type: not_null
