version: 2

models:
  - name: silver_contoso__orderrows_cleansed
    description: >
      Cleansing pass over the full bronze orderrows history: type casts and
      snake_case renaming only. No SCD, no joins to other models. Multiple
      rows per (order_key, line_number) are expected; SCD1 overwrite
      happens in silver_contoso__orderrows.
    config:
      contract:
        enforced: true
    meta:
      business_key: [order_key, line_number]
    columns:
      - name: order_key
        data_type: int
        description: Business key component.
        tests:
          - not_null
      - name: line_number
        data_type: int
        description: Business key component.
        tests:
          - not_null
      - name: product_key
        data_type: int
      - name: quantity
        data_type: int
      - name: unit_price
        data_type: double
      - name: net_price
        data_type: double
      - name: unit_cost
        data_type: double
      - name: _ingested_at
        data_type: timestamp
        description: Technical column, carried through from bronze.
        tests:
          - not_null
