version: 2

models:
  - name: silver_contoso__product
    description: >
      SCD2-historized products. Product is classic master data (spec.md),
      so every non-key attribute is tracked with full version history — no
      SCD1 (overwrite-in-place) columns for this entity. Exactly one row per
      product_key has `_is_current = true` at any time; prior versions are
      retained with `_valid_from`/`_valid_to` closed out. See
      dbt/macros/apply_scd2.sql for the historization design.
    config:
      contract:
        enforced: true
    meta:
      business_key: [product_key]
      scd1_columns: []
      scd2_columns:
        [
          product_code, product_name, manufacturer, brand, color,
          weight_unit, weight, cost, price, category_key, category_name,
          sub_category_key, sub_category_name,
        ]
    columns:
      - name: product_key
        data_type: int
        description: Business key.
        constraints:
          - type: not_null
        tests:
          - unique:
              config:
                where: "_is_current = true"
      - name: product_code
        data_type: string
      - name: product_name
        data_type: string
      - name: manufacturer
        data_type: string
      - name: brand
        data_type: string
      - name: color
        data_type: string
      - name: weight_unit
        data_type: string
      - name: weight
        data_type: double
      - name: cost
        data_type: double
      - name: price
        data_type: double
      - name: category_key
        data_type: int
      - name: category_name
        data_type: string
      - name: sub_category_key
        data_type: int
      - name: sub_category_name
        data_type: string
      - name: _ingested_at
        data_type: timestamp
        description: Technical column — when the underlying bronze snapshot was ingested.
        constraints:
          - type: not_null
      - name: _scd_hash
        data_type: string
        description: Technical column — sha2(256) over business_key + scd2_columns (see generate_hash macro).
        constraints:
          - type: not_null
      - name: _valid_from
        data_type: timestamp
        description: Technical column — when this version became current.
        constraints:
          - type: not_null
      - name: _valid_to
        data_type: timestamp
        description: >
          Technical column — when this version was superseded. Never null:
          a sentinel high timestamp (9999-12-31 23:59:59) while the version
          is current.
        constraints:
          - type: not_null
      - name: _is_current
        data_type: boolean
        description: Technical column — true for exactly one row per product_key at any time.
        constraints:
          - type: not_null
