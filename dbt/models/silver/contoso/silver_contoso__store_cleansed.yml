version: 2

models:
  - name: silver_contoso__store_cleansed
    description: >
      Cleansing pass over the full bronze store history: type casts and
      snake_case renaming only. No SCD, no joins to other models. Multiple
      rows per store_key are expected; historization happens in
      silver_contoso__store.
    config:
      contract:
        enforced: true
    meta:
      business_key: [store_key]
    columns:
      - name: store_key
        data_type: int
        description: Business key — not unique here (full bronze history passes through); see silver_contoso__store for the current/versioned view.
        tests:
          - not_null
      - name: store_code
        data_type: string
      - name: geo_area_key
        data_type: int
      - name: country_code
        data_type: string
      - name: country_name
        data_type: string
      - name: state
        data_type: string
      - name: open_date
        data_type: date
      - name: close_date
        data_type: date
        description: Nullable — still-open stores have no close date.
      - name: description
        data_type: string
      - name: square_meters
        data_type: double
      - name: status
        data_type: string
        description: Nullable.
      - name: _ingested_at
        data_type: timestamp
        description: Technical column, carried through from bronze.
        tests:
          - not_null
