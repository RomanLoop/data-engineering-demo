# Safe to commit: every value is an env_var() reference, never a literal secret
# (AGENT.md §8). Fill the real values in a local, gitignored .env (see
# .env.example at the repo root) — dbt reads them via env_var() at run time.
#
# User (CLI) auth: reuses the active `az login` session for the developer
# running dbt — no client_id/client_secret needed. Requires Azure CLI
# installed and `az login` run beforehand (the signed-in user needs access
# to the workspace + lakehouse). Switch to `authentication: SPN` (with
# client_id/client_secret/tenant_id) for CI/CD or other non-interactive runs
# — see docs.getdbt.com/docs/core/connect-data-platform/fabricspark-setup.

data_engineering_demo:
  target: dev
  outputs:
    dev:
      type: fabricspark
      method: livy
      authentication: CLI
      endpoint: "https://api.fabric.microsoft.com/v1"
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME', 'lh_contoso') }}"
      # Must differ from `lakehouse` — dbt-fabricspark only turns on
      # schema-enabled (multi-schema) mode when schema != lakehouse (see
      # credentials.py's lakehouse_schemas_enabled check). 'dbo' is the
      # Fabric-assigned default schema on a schema-enabled lakehouse.
      schema: dbo
      threads: 4
      # Keeps the Livy/Spark session alive and reused across separate `dbt`
      # invocations instead of cold-starting a new one every time (~2-4 min
      # observed per cold start during 001-onboard-contoso-customers). The
      # session is left running after the run finishes (not deleted) so the
      # next `dbt` command can reuse it — expect it to eventually idle-reap
      # on Fabric's side rather than being torn down by dbt itself.
      reuse_session: true
      spark_config:
        # 'name' is required by the installed dbt-fabricspark adapter
        # (not shown in the public docs page as of this writing — found by
        # running `dbt parse` locally against this profile).
        name: "data_engineering_demo"
